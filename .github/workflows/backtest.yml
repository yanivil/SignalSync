# Manual: walk-forward replay of the scanner over the last N sessions on the
# runner's open internet.  The Markdown report lands in the job summary.
#   gh workflow run backtest.yml [-f days=63] [-f horizon=40] [-f min_score=60]
#   gh workflow run backtest.yml -f period=5y -f days=500 -f bars=500 -f split=2025-09-09 -f horizon=60
# (the second form replays two years with each scan seeing the nightly's 500-bar
# window and reports the two years side by side: the out-of-sample check).
# Also runs on pushes that touch its own files (first registration / smoke test).
name: backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "sessions to replay"
        required: false
        default: "63"
      horizon:
        description: "bars after the fill before a signal counts as open"
        required: false
        default: "40"
      min_score:
        description: "MIN_SCORE override for the replay"
        required: false
        default: "60"
      profile:
        description: "rule profile to replay (spec or legacy); the other one is replayed alongside"
        required: false
        default: "spec"
      ablate:
        description: "true = leave-one-rule-out over the spec profile instead of the grid (use a short window)"
        required: false
        default: "false"
      overrides:
        description: "space-separated KEY=VALUE constant overrides, e.g. CUP_TRIGGER=rim_b WW_TIME_SYM_TOL=0.45"
        required: false
        default: ""
      period:
        description: "yfinance history period (2y = what the nightly downloads; 5y for a two-year replay)"
        required: false
        default: "2y"
      bars:
        description: "bars of history each scan sees (empty = all; 500 mimics the nightly 2y window in a long replay)"
        required: false
        default: ""
      split:
        description: "YYYY-MM-DD: also report the sessions before and from this date as separate windows"
        required: false
        default: ""
  push:
    paths:
      - tools/backtest.py
      - .github/workflows/backtest.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    # A runner replays about 5 s per session per profile over the full index; --grid runs two
    # profiles, so 63 sessions take about 10 minutes and a two-year (500-session) replay about 90.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.txt
      - name: Replay
        env:
          DAYS: ${{ github.event.inputs.days || '63' }}
          HORIZON: ${{ github.event.inputs.horizon || '40' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '60' }}
          PROFILE: ${{ github.event.inputs.profile || 'spec' }}
          ABLATE: ${{ github.event.inputs.ablate || 'false' }}
          OVERRIDES: ${{ github.event.inputs.overrides || '' }}
          PERIOD: ${{ github.event.inputs.period || '2y' }}
          BARS: ${{ github.event.inputs.bars || '' }}
          SPLIT: ${{ github.event.inputs.split || '' }}
        run: |
          if [ "$ABLATE" = "true" ]; then MODE=--ablate; else MODE=--grid; fi
          cmd=(python tools/backtest.py --days "$DAYS" --horizon "$HORIZON" --min-score "$MIN_SCORE"
               --profile "$PROFILE" --period "$PERIOD" "$MODE" --json backtest.json)
          if [ -n "$BARS" ]; then cmd+=(--bars "$BARS"); fi
          if [ -n "$SPLIT" ]; then cmd+=(--split "$SPLIT"); fi
          for kv in $OVERRIDES; do cmd+=(--set "$kv"); done
          "${cmd[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

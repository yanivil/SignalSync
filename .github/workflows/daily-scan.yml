# ---------------------------------------------------------------------------
# Daily S&P 500 pattern scan.
#
# Why GitHub Actions: the Claude cloud sandbox and the Claude shell on the
# user's Mac are both behind a network policy that blocks every market-data
# host, but GitHub runners have open internet and GitHub itself is reachable
# from Claude.  So the runner does the data pull + scan and commits the report;
# a scheduled task in the Claude desktop app (08:45 Israel time) reads
# output/signals.json + report.md from the repo and e-mails the tables.
#
# Schedule: 01:17 UTC daily = ~4.5 hours before the 08:45 Israel e-mail, and
# ~5 hours after the US close.  Off the top of the hour on purpose: GitHub
# delays scheduled workflows most at :00 (observed 2026-09-05: the 02:00 run
# started at 06:36, after the e-mail had gone out with a STALE flag).  Note: Yahoo's chart row for that session
# has no close until ~08:00 UTC (US pre-market open) -- observed 2026-09-04:
# 500/502 symbols incomplete at 08:05 UTC, complete at 08:10 UTC -- so scan.py
# fills the close from the chart's last-trade quote (fill_missing_close) and
# reports how many symbols needed that in meta.filled_close_symbols.
# Scheduled workflows only run on the default branch (main).
# ---------------------------------------------------------------------------
name: daily-scan

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:        # manual "Run workflow" button for testing

permissions:
  contents: write           # needed to commit output/ back to the repo

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.txt

      - name: Run tests (fast, no network)
        run: pip install --require-hashes -r requirements-dev.txt && python -m pytest -q

      - name: Run scan
        # Exit code 2 = no price data (Yahoo outage).  We still want the
        # commit step to record that, so capture the code instead of failing.
        run: |
          set +e
          # --profile legacy until the spec rules are tuned (2026-09-05 replay: spec confirmed
          # 22 signals in a year vs 354; see docs/wiki/03-Configuration-and-Tuning.md#rule-profiles)
          python scan.py --out-dir output -v --profile legacy
          echo "scan_exit=$?" >> "$GITHUB_ENV"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/report.md output/signals.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit (scan_exit=$scan_exit)"
          else
            git commit -m "scan: $(date -u +%Y-%m-%d) (exit $scan_exit)"
            # main may have moved while the scan ran; only the bot touches output/, so this cannot conflict
            git pull --rebase origin main
            git push
          fi

      - name: Fail job if the scan produced no data
        if: env.scan_exit != '0'
        run: |
          echo "scan.py exited with $scan_exit — see log above"
          exit 1

# ---------------------------------------------------------------------------
# Daily S&P 500 pattern scan.
#
# Why GitHub Actions: the Claude cloud sandbox and the Claude shell on the
# user's Mac are both behind a network policy that blocks every market-data
# host, but GitHub runners have open internet and GitHub itself is reachable
# from Claude.  So the runner does the data pull + scan and commits the report;
# the Claude scheduled task (07:00 Israel) reads output/report.md from the
# repo and e-mails it.
#
# Schedule: 02:00 UTC daily = ~2 hours before the Claude task at 04:00 UTC,
# and ~6 hours after the US close.  Note: Yahoo's daily row for that session
# is usually still volume-only (OHLC null) at this hour -- observed for
# 501/503 symbols at 07:28 UTC on 2026-09-04 -- so scan.py normally scans the
# session before it and reports that in meta.last_bar / meta.skipped_bar.
# Scheduled workflows only run on the default branch (main).
# ---------------------------------------------------------------------------
name: daily-scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:        # manual "Run workflow" button for testing

permissions:
  contents: write           # needed to commit output/ back to the repo

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (fast, no network)
        run: pip install pytest && python -m pytest test_scan.py -q

      - name: Run scan
        # Exit code 2 = no price data (Yahoo outage).  We still want the
        # commit step to record that, so capture the code instead of failing.
        run: |
          set +e
          python scan.py --out-dir output -v
          echo "scan_exit=$?" >> "$GITHUB_ENV"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/report.md output/signals.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit (scan_exit=$scan_exit)"
          else
            git commit -m "scan: $(date -u +%Y-%m-%d) (exit $scan_exit)"
            git push
          fi

      - name: Fail job if the scan produced no data
        if: env.scan_exit != '0'
        run: |
          echo "scan.py exited with $scan_exit — see log above"
          exit 1

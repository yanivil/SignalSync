# Test suite on every pull request and every push to main (the daily scan
# also runs it, but only at 02:00 UTC after the code is already on main).
name: tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "output/**"          # the nightly report commit changes no code

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint
        run: ruff check --select E,F,W --line-length 120 .
      - name: Test (offline, with coverage)
        run: python -m pytest -q --cov=scan --cov=tools --cov-report=term-missing
